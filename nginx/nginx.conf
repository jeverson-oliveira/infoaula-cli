# Rate limit simples anti-abuso em sala (30 alunos dando F5 no /sync).
limit_req_zone $binary_remote_addr zone=infoaula:10m rate=10r/s;

server {
  listen 80;
  server_name _;

  server_tokens off;
  # API é somente GET pública — bloqueia o resto já na borda
  limit_except GET { deny all; }
  client_max_body_size 10k;

  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "DENY" always;
  add_header Referrer-Policy "no-referrer" always;

  location / {
    limit_req zone=infoaula burst=20 nodelay;
    proxy_pass http://api:8000;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }
}
