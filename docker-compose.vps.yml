# InfoAula na VPS — modo simples (sem Postgres, só seed.json).
# Ideal p/ VPS barata (1 vCPU / 1GB) e laboratório: 1 container, ~150MB RAM.
#
# Na VPS:
#   git clone <repo> && cd infoaula-cli
#   docker compose -f docker-compose.vps.yml up -d --build
#   curl -s http://localhost:8080/health
#
# Aluno (sem instalar nada):
#   export INFOAULA_URL=http://SEU-VPS:8080
#   curl -sSL $INFOAULA_URL/infoaula.sh | bash -s dica

services:
  api:
    build:
      context: .
      dockerfile: docker/Dockerfile.api
    image: infoaula-api:latest
    restart: unless-stopped
    ports:
      - "8080:8000"
    environment:
      INFOAULA_SEED: /app/content/seed.json
    volumes:
      # atualiza conteúdo sem rebuild: edite content/seed.json e dê `docker compose -f docker-compose.vps.yml restart api`
      - ./content:/app/content:ro
      - ./scripts:/app/scripts:ro
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=4)"]
      interval: 30s
      timeout: 5s
      retries: 3
